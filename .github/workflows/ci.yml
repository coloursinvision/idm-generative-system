# =============================================================================
# IDM Generative System - CI Pipeline
# Gitflow: develop = active dev, main = release-ready only.
#
# Triggers:
#   push to develop   -> lint + type-check + test + Docker build (no push)
#   PR to main        -> lint + type-check + test + Docker build (no push)
#   push to main      -> lint + type-check + test + Docker build + push to GHCR
#   hotfix/* branches -> lint + type-check + test
#
# A gitleaks secret scan runs on every trigger, in parallel with lint.
# A text-hygiene check judges only the lines each change adds, also in parallel.
# =============================================================================

name: CI

on:
  push:
    branches: [develop, main, "hotfix/**"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write  # GHCR push on main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & Format
  # ---------------------------------------------------------------------------
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        # Pinned to the workstation version. Unpinned, CI drifts with upstream:
        # 0.16 began formatting Python blocks inside Markdown, which reddens
        # untouched docs on every PR. Installed directly rather than through
        # the dev extra to keep this job fast, since three others wait on it;
        # the version must therefore be kept in step with pyproject [dev].
        run: pip install ruff==0.15.16

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 2: Type Check
  # ---------------------------------------------------------------------------
  typecheck:
    name: "Type Check (mypy)"
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-typecheck-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-typecheck-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run mypy
        run: mypy engine/ api/ knowledge/ --config-file pyproject.toml

  # ---------------------------------------------------------------------------
  # Job 3: Test
  # ---------------------------------------------------------------------------
  test:
    name: "Test Suite"
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-test-

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        env:
          # Stub keys - external services are mocked in tests.
          OPENAI_API_KEY: "sk-test-000000000000000000000000000000000000000000000000"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "test-key"
        run: |
          pytest \
            --tb=short \
            --strict-markers \
            -q \
            --cov=engine --cov=api --cov=knowledge \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 4: Docker Build (+ Push on main)
  # ---------------------------------------------------------------------------
  docker:
    name: "Docker"
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, test, secret-scan]
    # Only build Docker on develop pushes, main pushes, and PRs to main.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
      || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ github.sha }}
          restore-keys: buildx-

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: .
          # Push ONLY on merge to main.
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Rotate cache to prevent unbounded growth.
      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ---------------------------------------------------------------------------
  # Job 5 - Secret Scan
  # ---------------------------------------------------------------------------
  secret-scan:
    name: "Secret Scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history; a shallow clone contains none of it, which
          # would make this job pass unconditionally.
          fetch-depth: 0

      - name: Install gitleaks
        # Pinned to the revision in .pre-commit-config.yaml so local and CI
        # agree. Unpinned tooling in CI has already reddened this pipeline once.
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}/bin" gitleaks

      - name: Scan git history
        # --redact keeps any match out of this public build log.
        run: ${RUNNER_TEMP}/bin/gitleaks detect --redact -v

  # Job 6: text hygiene. Only the lines a change adds are judged, against the
  # pull-request base or the pushed range, so text that predates the policy
  # does not fail the build. Commit messages and the pull-request title land
  # in history, so they are checked as well.
  text-hygiene:
    name: "Text Hygiene"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit and every commit in the range must be present.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Resolve the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # --diff reads the working tree, so it must be exactly the commit under test.
          test -z "$(git status --porcelain)"
          if [ "$EVENT" = "pull_request" ]; then
            # The checkout is the test merge commit; its first parent is the base.
            base=$(git rev-parse HEAD^1)
            range="HEAD^1..HEAD^2"
          elif [ -n "${BEFORE//0/}" ]; then
            base=$BEFORE
            range="$BEFORE..HEAD"
          else
            # A new branch has no previous tip; hotfix branches start from main.
            base=$(git merge-base origin/main HEAD)
            range="$base..HEAD"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Check added lines
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          echo "::add-matcher::.github/text-hygiene-matcher.json"
          python scripts/check_text_hygiene.py --diff "$BASE"

      - name: Check commit messages
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        env:
          RANGE: ${{ steps.base.outputs.range }}
          # Through the environment only: a title from a fork is untrusted input.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Commits reachable from the epoch predate this check and cannot be rewritten.
          epoch=9644496865043d28b2bd5d6e6d9aa5f63ce7dea6
          status=0
          for commit in $(git rev-list "$RANGE" "^$epoch"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/msg-$commit"
            python scripts/check_text_hygiene.py --commit-msg "$RUNNER_TEMP/msg-$commit" || status=1
          done
          if [ -n "$PR_TITLE" ]; then
            printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
            python scripts/check_text_hygiene.py --commit-msg "$RUNNER_TEMP/pr-title" || status=1
          fi
          exit "$status"
