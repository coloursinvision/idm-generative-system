# E2E browser tests - runs Playwright against the Vite dev server
# with mocked API routes (no backend required).

name: E2E Tests

on:
  push:
    branches: [develop, main, "hotfix/*"]
  pull_request:
    branches: [develop, main]

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The image carries the browsers and their system packages. Its tag must
    # match the Playwright version in frontend/package-lock.json; on a mismatch
    # the tests fail and Playwright names the image it requires.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run E2E tests
        working-directory: frontend
        run: npm run e2e -- --project=chromium --project=firefox
        env:
          CI: true

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
