name: Deploy

# GitHub runs the version of this file on the default branch, so a change here
# takes effect only once it is on main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy to production"
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # The deploy key and host settings live in this environment, which only main may deploy to.
    environment:
      name: production
      url: https://idm.coloursinvision.ai
    steps:
      # Without a fingerprint the SSH action accepts any host key, so the deploy stops first.
      - name: Require the host key fingerprint
        env:
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
        run: |
          if [[ ! "$FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo "::error::DEPLOY_HOST_FINGERPRINT is missing or not a SHA256 host key fingerprint"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_HOST_FINGERPRINT }}
          # The key's forced command runs scripts/deploy_api.sh with the command it
          # receives as the only argument, so the command is just the commit the CI
          # run built (github.sha is the default branch tip here); the script refuses
          # anything else.
          script: ${{ github.event.workflow_run.head_sha }}
